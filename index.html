<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩팥의 여과, 재흡수, 분비 시뮬레이션</title>
    <!-- 구글 폰트 (Jua & Poor Story) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poor Story', 'Pretendard', sans-serif;
            letter-spacing: -0.3px;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
                .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh; /* 아이패드 Safari 주소창·탭바를 뺀 실제 보이는 높이 */
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 14px 12px;
        }

        /* 1. 우측 상단 3x2 물질 버튼 패널 */
                .top-controls {
            flex: 0 0 auto;
            align-self: center;
            width: 100%;
            max-width: 780px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: clamp(38px, 5vh, 54px);
            gap: 8px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* 2. 좌측 하단 제어 버튼 패널 */
                /* 2. 재생·퀴즈 버튼 줄 (화면 크기와 상관없이 항상 보임) */
        .action-bar {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .action-left {
            display: flex;
            gap: 8px;
        }
        .rotate-hint {
            display: none;
            flex: 0 0 auto;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        /* 물질 토글 버튼 스타일 */
        .mat-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            min-width: 0;
            line-height: 1.1;
            text-align: left;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: clamp(14px, 1.7vw, 20px);
            color: #64748b;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mat-btn .btn-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mat-btn canvas.btn-icon {
            width: 24px;
            height: 24px;
            display: block;
        }
        .mat-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .mat-btn.active {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #0f172a;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(59, 130, 246, 0.15);
        }
        .mat-btn .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: background 0.15s;
        }
        .mat-btn.active .status-dot {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* 일반 버튼 스타일 */
        .btn {
            padding: 0 16px;
            height: clamp(38px, 5vh, 54px);
            border: none;
            border-radius: 10px;
            background: #e2e8f0;
            color: #334155;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(14px, 1.6vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover {
            background: #cbd5e1;
        }
        .btn.primary {
            background: #3b82f6;
            color: white;
        }
        .btn.primary:hover {
            background: #2563eb;
        }
        .btn.quiz-btn {
            background: #8b5cf6;
            color: white;
        }
        .btn.quiz-btn:hover {
            background: #7c3aed;
        }
        .btn.all-view {
            background: #0f172a;
            color: white;
            font-size: clamp(12px, 1.4vw, 18px);
        }
        .btn.all-view:hover {
            background: #1e293b;
        }

        /* 뷰 영역 및 캔버스 풀스크린 */
                .view-area {
            position: relative;
            flex: 1 1 auto;
            min-height: 0; /* 남는 공간만 차지 → 위아래 패널과 겹치지 않음 */
            width: 100%;
            overflow: hidden;
        }
        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #bgCanvas, #particleCanvas, #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 하단 가득 채우는 개념 설명 패널 */
                .info-panel {
            flex: 0 0 auto;
            height: clamp(84px, 17dvh, 150px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .info-panel > strong:first-child { margin-top: auto; }
        .info-panel > span:last-child { margin-bottom: auto; }
                .info-panel strong {
            color: #1e293b;
            font-size: clamp(16px, 2vw, 26px);
            margin-bottom: 4px;
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 8px;
        }
                .info-panel span {
            color: #334155;
            font-size: clamp(13px, 1.6vw, 22px);
            line-height: 1.35;
        }

        /* 🧠 플로팅 퀴즈 팝업 모달창 스타일 */
        .quiz-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(94vw, 560px);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 2px solid #8b5cf6;
            border-radius: 20px;
            padding: clamp(12px, 3vw, 24px);
            z-index: 100;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.2);
            display: none;
            flex-direction: column;
            gap: clamp(8px, 2vw, 16px);
        }
        .quiz-modal.active {
            display: flex;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .quiz-header h3 {
            color: #7c3aed;
            font-size: clamp(17px, 2.6vw, 24px);
        }
        .quiz-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
        }
        .quiz-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-question {
            font-size: clamp(15px, 2.4vw, 20px);
            color: #1e293b;
            font-weight: bold;
            line-height: 1.4;
        }
        .quiz-input-row {
            display: flex;
            gap: 10px;
        }
        .quiz-input {
            flex: 1;
            height: 46px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        .quiz-input:focus {
            border-color: #8b5cf6;
        }
        .quiz-submit-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quiz-submit-btn:hover {
            background: #7c3aed;
        }
        .quiz-feedback {
            font-size: clamp(15px, 2.2vw, 19px);
            font-weight: bold;
            min-height: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #f1f5f9;
            padding-top: 12px;
        }
        .quiz-nav-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #334155;
        }
        .quiz-nav-btn:hover {
            background: #cbd5e1;
        }
        .quiz-modal { max-height: 92vh; max-height: 92dvh; overflow-y: auto; }
        .quiz-input-row { justify-content: flex-end; }
        .quiz-submit-btn { height: 46px; }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            font-size: clamp(14px, 2.2vw, 19px);
            min-height: 44px;
            color: #1e293b;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }
        .quiz-option:hover { background: #f1f5f9; border-color: #94a3b8; }
        .quiz-option input {
            width: 22px;
            height: 22px;
            accent-color: #8b5cf6;
            cursor: pointer;
            flex-shrink: 0;
        }
        .quiz-option.checked {
            background: #f5f3ff;
            border-color: #8b5cf6;
        }
        .quiz-progress {
            font-size: 16px;
            color: #64748b;
            font-weight: bold;
        }
        /* 문항별 풀이 상태 표시 (번호 → ⭕/❌) */
        .quiz-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .quiz-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #f8fafc;
            color: #64748b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }
        .quiz-dot.current { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
        .quiz-dot.correct { background: #dcfce7; border-color: #16a34a; }
        .quiz-dot.wrong { background: #fee2e2; border-color: #dc2626; }

        /* 4문제를 모두 풀면 나타나는 결과 */
        .quiz-score {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f5f3ff;
            border: 2px solid #8b5cf6;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: clamp(15px, 2.4vw, 20px);
            font-weight: bold;
            color: #5b21b6;
        }
        .quiz-score.show { display: flex; }
        .quiz-retry-btn {
            flex-shrink: 0;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: clamp(14px, 2vw, 17px);
            font-weight: bold;
            cursor: pointer;
        }
        .quiz-retry-btn:hover { background: #7c3aed; }

        /* ===== 작은 화면 보정 ===== */
        /* 세로로 든 폰 */
        @media (max-width: 640px) {
            .app-container { padding: 6px 8px 8px; gap: 6px; }
            .top-controls {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 38px;
                gap: 5px;
                padding: 6px;
                border-radius: 12px;
            }
            .mat-btn { padding: 0 8px; }
            .mat-btn .btn-left { gap: 6px; }
            .mat-btn canvas.btn-icon { width: 20px; height: 20px; }
            .btn { padding: 0 12px; height: 40px; }
            .info-panel { padding: 8px 14px; height: clamp(96px, 20dvh, 150px); }
            .quiz-dots { gap: 6px; }
            .quiz-dot { width: 34px; height: 34px; font-size: 14px; }
            .quiz-nav-btn { padding: 8px 12px; }
        }
        @media (max-width: 640px) and (orientation: portrait) {
            .rotate-hint { display: block; }
        }
        /* 가로로 눕힌 폰처럼 세로 공간이 좁은 화면 */
        @media (max-height: 500px) {
            .app-container { padding: 4px 8px 6px; gap: 4px; }
            .top-controls {
                max-width: none;
                grid-template-columns: repeat(6, 1fr);
                grid-auto-rows: 34px;
                gap: 4px;
                padding: 4px;
                border-radius: 10px;
            }
            .mat-btn { padding: 0 6px; font-size: 11px; border-radius: 8px; }
            .mat-btn .btn-left { gap: 4px; }
            .mat-btn .status-dot { display: none; }
            .mat-btn canvas.btn-icon { width: 16px; height: 16px; }
            .btn { height: 32px; font-size: 13px; padding: 0 12px; }
            .btn.all-view { font-size: 11px; padding: 0 4px; }
            .info-panel { height: 64px; padding: 6px 14px; border-radius: 10px; }
            .info-panel strong { font-size: 14px; margin-bottom: 2px; }
            .info-panel span { font-size: 12px; line-height: 1.3; }
            .quiz-modal { padding: 10px 14px; gap: 6px; }
            .quiz-header { padding-bottom: 6px; }
            .quiz-header h3 { font-size: 16px; }
            .quiz-question { font-size: 14px; line-height: 1.3; }
            .quiz-body { gap: 6px; }
            .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
            .quiz-option { min-height: 36px; padding: 4px 10px; font-size: 13px; gap: 8px; }
            .quiz-option input { width: 18px; height: 18px; }
            .quiz-submit-btn { height: 36px; font-size: 15px; padding: 0 16px; }
            .quiz-feedback { min-height: 22px; font-size: 14px; }
            .quiz-footer { padding-top: 6px; }
            .quiz-nav-btn { padding: 6px 12px; font-size: 14px; }
            .quiz-dot { width: 28px; height: 28px; font-size: 12px; gap: 6px; }
            .quiz-dots { gap: 6px; }
            .quiz-body { display: grid; grid-template-columns: 1fr auto; align-items: center; }
            .quiz-question, .quiz-options, .quiz-score { grid-column: 1 / -1; }
            .quiz-feedback { grid-column: 1; grid-row: 3; }
            .quiz-input-row { grid-column: 2; grid-row: 3; }
            .quiz-score { padding: 6px 10px; font-size: 14px; }
            .quiz-retry-btn { padding: 5px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 물질 버튼 패널 -->
    <div class="top-controls">
        <button class="mat-btn" data-target="chkRbc">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="rbc" width="24" height="24"></canvas>
                <span>적혈구</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkProtein">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="protein" width="24" height="24"></canvas>
                <span>단백질</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkGlucose">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="glucose" width="24" height="24"></canvas>
                <span>포도당/아미노산</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkWater">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="water" width="24" height="24"></canvas>
                <span>물/무기염류</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkUrea">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="urea" width="24" height="24"></canvas>
                <span>요소/노폐물</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="btn all-view" id="btnAllView">모든 물질 보기 (ON/OFF)</button>
    </div>

    <div class="rotate-hint">📱 화면을 가로로 돌리면 더 크게 볼 수 있어요</div>

    <!-- 2. 애니메이션 영역 (위아래 패널을 뺀 남은 공간) -->
    <div class="view-area">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="bgCanvas"></canvas>
            <canvas id="particleCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
        </div>
    </div>

    <!-- 3. 재생·퀴즈 버튼 줄 -->
    <div class="action-bar">
        <div class="action-left">
            <button class="btn primary" id="btnPlayPause">일시정지</button>
            <button class="btn" id="btnReset">처음으로</button>
        </div>
        <button class="btn quiz-btn" id="btnQuizModalOpen">🧠 콩팥 퀴즈 풀기</button>
    </div>

    <!-- 4. 개념 설명 패널 -->
    <div class="info-panel" id="infoPanel">
        <strong id="infoTitle">📍 [ 콩팥의 구조와 물질 이동 시뮬레이션 ]</strong>
        <span id="infoDesc">화면의 물음표(?) 상자를 터치하면 해당 부위의 명칭과 설명이 뜬 상태로 유지됩니다.</span>
    </div>

    <!-- 🧠 플로팅 퀴즈 팝업 창 -->
    <div class="quiz-modal" id="quizModal">
        <div class="quiz-header">
            <h3 id="quizTitle">🧠 콩팥 핵심 개념 퀴즈</h3>
            <button class="quiz-close-btn" id="quizCloseBtn">✕</button>
        </div>
        <div class="quiz-body">
            <div class="quiz-question" id="quizQuestionText">문제 내용이 여기에 들어갑니다.</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-input-row">
                <button class="quiz-submit-btn" id="quizSubmitBtn">답 확인</button>
            </div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <div class="quiz-score" id="quizScore">
                <span id="quizScoreText"></span>
                <button class="quiz-retry-btn" id="quizRetryBtn">다시 풀기</button>
            </div>
        </div>
        <div class="quiz-footer">
            <button class="quiz-nav-btn" id="quizPrevBtn">◀ 이전</button>
            <div class="quiz-dots" id="quizDots"></div>
            <button class="quiz-nav-btn" id="quizNextBtn">다음 ▶</button>
        </div>
    </div>
</div>

<script>
const BASE_WIDTH = 830;
const BASE_HEIGHT = 360;

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');
const canvasContainer = document.getElementById('canvasContainer');

const infoTitle = document.getElementById('infoTitle');
const infoDesc = document.getElementById('infoDesc');

let scaleRatio = 1;
let offsetX = 0;
let offsetY = 0;
let dpr = 1;          // 화면 선명도(레티나) 배율
let cssScale = 1;     // 기준 좌표 1이 화면에서 몇 px인지
let pm = 1;           // 작은 화면에서 입자를 키우는 배율
let lastSizeKey = '';
const hitRects = {};  // 마지막으로 그린 라벨 상자 (터치 판정용)

// 공통 도형 그리기 함수
function drawShape(cCtx, type, cx, cy, radius, color) {
    cCtx.beginPath();
    
    if (type === 'rbc') {
        const gradient = cCtx.createRadialGradient(cx, cy, 1, cx, cy, radius);
        gradient.addColorStop(0, '#ff9999');   
        gradient.addColorStop(0.55, '#ef4444'); 
        gradient.addColorStop(1, '#991b1b');   

        cCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        cCtx.fillStyle = gradient;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(150, 0, 0, 0.4)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type === 'protein') {
        const size = radius * 1.8;
        cCtx.fillStyle = color;
        cCtx.fillRect(cx - size / 2, cy - size / 2, size, size);
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.strokeRect(cx - size / 2, cy - size / 2, size, size);

    } else if (type === 'glucose') {
        const r = radius * 1.3;
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const hx = cx + r * Math.cos(angle);
            const hy = cy + r * Math.sin(angle);
            if (i === 0) cCtx.moveTo(hx, hy);
            else cCtx.lineTo(hx, hy);
        }
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type.includes('water')) {
        const r = radius * 1.2;
        cCtx.moveTo(cx, cy - r * 1.4);
        cCtx.bezierCurveTo(cx + r * 1.2, cy - r * 0.2, cx + r * 1.2, cy + r * 1.1, cx, cy + r * 1.1);
        cCtx.bezierCurveTo(cx - r * 1.2, cy + r * 1.1, cx - r * 1.2, cy - r * 0.2, cx, cy - r * 1.4);
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.15)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type.includes('urea')) {
        const r = radius * 1.4;
        cCtx.moveTo(cx, cy - r);
        cCtx.lineTo(cx + r, cy + r * 0.8);
        cCtx.lineTo(cx - r, cy + r * 0.8);
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.stroke();
    }
}

// 화면 크기 리사이징 계산 함수
function resizeCanvases() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssW = canvasContainer.clientWidth;
    const cssH = canvasContainer.clientHeight;
    if (!cssW || !cssH) return;

    const key = cssW + 'x' + cssH + '@' + dpr;
    if (key === lastSizeKey) return;
    lastSizeKey = key;

    const pxW = Math.round(cssW * dpr);
    const pxH = Math.round(cssH * dpr);
    [bgCanvas, canvas, overlayCanvas].forEach(c => {
        c.width = pxW;
        c.height = pxH;
    });

    cssScale = Math.min(cssW / BASE_WIDTH, cssH / BASE_HEIGHT);
    scaleRatio = cssScale * dpr;
    offsetX = (pxW - BASE_WIDTH * scaleRatio) / 2;
    offsetY = (pxH - BASE_HEIGHT * scaleRatio) / 2;

    // 화면이 작아 그림이 줄어들면 입자를 조금 키워서 잘 보이게 (물질 사이의 크기 비율은 그대로)
    pm = Math.min(1.8, Math.max(1, 0.9 / cssScale));

    drawBackground();
}

class Particle {
    constructor(type, path, color, radius, speed) {
        this.type = type;
        this.path = path;
        this.color = color;
        this.radius = radius;
        this.speed = speed;
        this.pathIndex = 0;
        this.progress = 0;
        this.x = path[0].x;
        this.y = path[0].y;
    }

    update() {
        if (this.pathIndex >= this.path.length - 1) return false; 
        const start = this.path[this.pathIndex];
        const end = this.path[this.pathIndex + 1];
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        this.speed = 1.8; 
        this.progress += this.speed / distance;

        if (this.progress >= 1) {
            this.progress = 0;
            this.pathIndex++;
        }

        if (this.pathIndex < this.path.length - 1) {
            const currStart = this.path[this.pathIndex];
            const currEnd = this.path[this.pathIndex + 1];
            this.x = currStart.x + (currEnd.x - currStart.x) * this.progress;
            this.y = currStart.y + (currEnd.y - currStart.y) * this.progress;
        }
        return true;
    }

    draw() {
        drawShape(ctx, this.type, this.x, this.y, this.radius * pm, this.color);
    }
}

function drawOverlay() {

    regions.forEach(l => {
        const isRevealed = revealedLabels[l.name];
        const isSelected = selectedRegion && selectedRegion.name === l.name;

        const textWidth = overlayCtx.measureText(displayText).width;
        const w = Math.max(textWidth + 18 * k, 42 * k);
        const h = 26 * k;
        const top = l.y - 16 * k;

        if (isRevealed) {
            if (isProcess) {
                overlayCtx.fillStyle = isSelected ? 'rgba(220, 252, 231, 0.98)' : 'rgba(240, 253, 244, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#16a34a' : '#bbf7d0';

                overlayCtx.strokeStyle = isSelected ? '#3b82f6' : '#cbd5e1';
            }
            overlayCtx.lineWidth = isSelected ? 2 : 1;
        } else {
            // 미열람 (물음표 상자 상태) - 구조는 노란색, 과정은 초록색
            if (isProcess) {
                overlayCtx.fillStyle = isSelected ? 'rgba(187, 247, 208, 0.98)' : 'rgba(220, 252, 231, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#16a34a' : '#86efac';
            } else {
                overlayCtx.fillStyle = isSelected ? 'rgba(254, 240, 138, 0.98)' : 'rgba(254, 249, 195, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#eab308' : '#fde047';
            }
            overlayCtx.lineWidth = 2;
        }

        overlayCtx.fillRect(l.x - w / 2, top, w, h);
        overlayCtx.strokeRect(l.x - w / 2, top, w, h);

        if (isRevealed) {
            overlayCtx.fillStyle = isProcess ? (isSelected ? '#15803d' : '#166534') : (isSelected ? '#1d4ed8' : '#1e293b');
        } else {
            overlayCtx.fillStyle = isProcess ? '#166534' : '#854d0e';
        }
        overlayCtx.fillText(displayText, l.x, l.y + 4 * k);

        hitRects[l.name] = { x: l.x, y: top + h / 2, w: w, h: h };
    });

    overlayCtx.restore();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scaleRatio, scaleRatio);

    if (isRunning) {
        particleConfigs.forEach(cfg => {
            if (states[cfg.id]) {
                spawnCounters[cfg.type]++;
                if (spawnCounters[cfg.type] >= cfg.interval) {
                    particles.push(new Particle(cfg.type, cfg.path, cfg.color, cfg.radius, cfg.speed));
                    spawnCounters[cfg.type] = 0;
                }
            }
        });

        particles = particles.filter(p => {
            const isAlive = p.update();
            if (isAlive && states[getConfigId(p.type)]) {
                p.draw();
            }
            return isAlive;
        });
    } else {
        particles.forEach(p => {
            if (states[getConfigId(p.type)]) {
                p.draw();
            }
        });
    }

    ctx.restore();
    drawOverlay();
    requestAnimationFrame(animate);
}

    const correct = quizState.filter(st => st.firstTry).length;

    currentQuizIndex = index;
    const st = quizState[index];
    quizQuestionText.textContent = quizData[index].q;
    quizOptions.innerHTML = "";
    // 정답이 1개인 문항은 하나만 고르는 라디오 버튼, 2개 이상이면 체크박스
    const isSingle = quizData[index].answers.length === 1;
    quizData[index].options.forEach(text => {
        const label = document.createElement('label');
        label.className = 'quiz-option';
        const cb = document.createElement('input');
        cb.type = isSingle ? 'radio' : 'checkbox';
        cb.name = 'quizOpt';
        cb.value = text;
        cb.checked = st.selected.includes(text); // 이전에 고른 답 복원
        label.classList.toggle('checked', cb.checked);
        cb.addEventListener('change', () => {
            quizOptions.querySelectorAll('.quiz-option').forEach(l =>
                l.classList.toggle('checked', l.querySelector('input').checked));
            st.selected = Array.from(quizOptions.querySelectorAll('input:checked')).map(i => i.value);
            st.result = null;           // 답을 바꾸면 다시 '답 확인'을 눌러야 함
            quizFeedback.innerHTML = "";
            renderDots();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(text));
        quizOptions.appendChild(label);
    });
    quizFeedback.innerHTML = st.result === true ? FEEDBACK_OK : st.result === false ? FEEDBACK_NO : "";
    renderDots();
    updateScore();
}

function resetQuiz() {
    quizState = quizData.map(() => ({ selected: [], result: null, firstTry: null }));
    currentQuizIndex = 0;
    if (quizModal.classList.contains('active')) loadQuiz(0);
}

document.getElementById('btnQuizModalOpen').addEventListener('click', () => {
    quizModal.classList.add('active');
    loadQuiz(currentQuizIndex);
});

document.getElementById('quizCloseBtn').addEventListener('click', () => {
    quizModal.classList.remove('active');
});

document.getElementById('quizPrevBtn').addEventListener('click', () => {
    if (currentQuizIndex > 0) {
        loadQuiz(currentQuizIndex - 1);
    }
});

document.getElementById('quizNextBtn').addEventListener('click', () => {
    if (currentQuizIndex < quizData.length - 1) {
        loadQuiz(currentQuizIndex + 1);
    }
});

document.getElementById('quizRetryBtn').addEventListener('click', resetQuiz);

// 답 확인 및 채점 로직 (선택한 보기 = 정답 보기 일 때만 정답)
quizSubmitBtn.addEventListener('click', () => {
    const selected = Array.from(quizOptions.querySelectorAll('input:checked')).map(cb => cb.value);
    if (selected.length === 0) {
        quizFeedback.innerHTML = "<span style='color:#d97706;'>⚠️ 정답을 골라주세요!</span>";
        return;
    }

    const answers = quizData[currentQuizIndex].answers;
    const isCorrect = selected.length === answers.length && answers.every(a => selected.includes(a));

    const st = quizState[currentQuizIndex];
    st.selected = selected;
    st.result = isCorrect;
    if (st.firstTry === null) st.firstTry = isCorrect;

    quizFeedback.innerHTML = isCorrect ? FEEDBACK_OK : FEEDBACK_NO;
    renderDots();
    updateScore();
});

// 물질 토글 버튼 이벤트
document.querySelectorAll('.mat-btn[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        states[target] = !states[target];
        btn.classList.toggle('active', states[target]);

        if (!states[target]) {
            particles = particles.filter(p => getConfigId(p.type) !== target);
        }
    });
});

// 모든 물질 보기 버튼
let allViewMode = false;
const btnAllView = document.getElementById('btnAllView');
btnAllView.addEventListener('click', () => {
    allViewMode = !allViewMode;
    ['chkRbc', 'chkProtein', 'chkGlucose', 'chkWater', 'chkUrea'].forEach(id => {
        states[id] = allViewMode;
        const btn = document.querySelector(`[data-target="${id}"]`);
        if (btn) btn.classList.toggle('active', allViewMode);
    });
    btnAllView.textContent = allViewMode ? '모든 물질 끄기' : '모든 물질 보기 (ON/OFF)';
    if (!allViewMode) particles = [];
});

// 재생/일시정지 제어
const btnPlayPause = document.getElementById('btnPlayPause');
btnPlayPause.addEventListener('click', () => {
    isRunning = !isRunning;
    btnPlayPause.textContent = isRunning ? '일시정지' : '재생';
});

// 처음으로 버튼
document.getElementById('btnReset').addEventListener('click', () => {
    initParticles();
    particles = [];
    Object.keys(revealedLabels).forEach(k => revealedLabels[k] = false);
    selectedRegion = null;
    infoTitle.textContent = "📍 [ 콩팥의 구조와 물질 이동 시뮬레이션 ]";
    infoDesc.textContent = "화면의 물음표(?) 상자를 터치하면 해당 부위의 명칭과 설명이 나타납니다.";
    quizModal.classList.remove('active');
    resetQuiz();
    drawOverlay();
});

// 실행
initButtonIcons();
initParticles();
resizeCanvases();
animate();
</script>
