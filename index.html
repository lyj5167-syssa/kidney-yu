<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩팥의 여과, 재흡수, 분비 시뮬레이션</title>
    <!-- 구글 폰트 (Jua & Poor Story) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poor Story', 'Pretendard', sans-serif;
            letter-spacing: -0.3px;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* 1. 우측 상단 3x2 물질 버튼 패널 */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, clamp(160px, 17vw, 220px));
            grid-template-rows: repeat(2, clamp(44px, 5vh, 56px));
            gap: 8px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* 2. 좌측 하단 제어 버튼 패널 */
        .bottom-left-controls {
            position: absolute;
            bottom: 160px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 30;
        }

        /* 3. 우측 하단 퀴즈 모드 제어 버튼 패널 */
        .bottom-right-controls {
            position: absolute;
            bottom: 160px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 30;
        }

        /* 물질 토글 버튼 스타일 */
        .mat-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: clamp(16px, 1.5vw, 20px);
            color: #64748b;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mat-btn .btn-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mat-btn canvas.btn-icon {
            width: 24px;
            height: 24px;
            display: block;
        }
        .mat-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .mat-btn.active {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #0f172a;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(59, 130, 246, 0.15);
        }
        .mat-btn .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: background 0.15s;
        }
        .mat-btn.active .status-dot {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* 일반 버튼 스타일 */
        .btn {
            padding: 0 16px;
            height: clamp(44px, 5vh, 56px);
            border: none;
            border-radius: 10px;
            background: #e2e8f0;
            color: #334155;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(16px, 1.5vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover {
            background: #cbd5e1;
        }
        .btn.primary {
            background: #3b82f6;
            color: white;
        }
        .btn.primary:hover {
            background: #2563eb;
        }
        .btn.quiz-btn {
            background: #8b5cf6;
            color: white;
        }
        .btn.quiz-btn:hover {
            background: #7c3aed;
        }
        .btn.all-view {
            background: #0f172a;
            color: white;
            font-size: clamp(14px, 1.3vw, 18px);
        }
        .btn.all-view:hover {
            background: #1e293b;
        }

        /* 뷰 영역 및 캔버스 풀스크린 */
        .view-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #bgCanvas, #particleCanvas, #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 하단 가득 채우는 개념 설명 패널 */
        .info-panel {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            height: clamp(110px, 14vh, 135px);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 14px 28px;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info-panel strong {
            color: #1e293b;
            font-size: clamp(21px, 2vw, 28px);
            margin-bottom: 4px;
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-panel span {
            color: #334155;
            font-size: clamp(18px, 1.7vw, 23px);
            line-height: 1.35;
        }

        /* 🧠 플로팅 퀴즈 팝업 모달창 스타일 */
        .quiz-modal {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(340px, 50vw, 550px);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 2px solid #8b5cf6;
            border-radius: 20px;
            padding: 24px;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.2);
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .quiz-modal.active {
            display: flex;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .quiz-header h3 {
            color: #7c3aed;
            font-size: 24px;
        }
        .quiz-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
        }
        .quiz-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-question {
            font-size: 20px;
            color: #1e293b;
            font-weight: bold;
            line-height: 1.4;
        }
        .quiz-input-row {
            display: flex;
            gap: 10px;
        }
        .quiz-input {
            flex: 1;
            height: 46px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        .quiz-input:focus {
            border-color: #8b5cf6;
        }
        .quiz-submit-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quiz-submit-btn:hover {
            background: #7c3aed;
        }
        .quiz-feedback {
            font-size: 19px;
            font-weight: bold;
            min-height: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #f1f5f9;
            padding-top: 12px;
        }
        .quiz-nav-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #334155;
        }
        .quiz-nav-btn:hover {
            background: #cbd5e1;
        }
        .quiz-modal { max-height: 90vh; overflow-y: auto; }
        .quiz-input-row { justify-content: flex-end; }
        .quiz-submit-btn { height: 46px; }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 19px;
            color: #1e293b;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }
        .quiz-option:hover { background: #f1f5f9; border-color: #94a3b8; }
        .quiz-option input {
            width: 22px;
            height: 22px;
            accent-color: #8b5cf6;
            cursor: pointer;
            flex-shrink: 0;
        }
        .quiz-option.checked {
            background: #f5f3ff;
            border-color: #8b5cf6;
        }
        .quiz-progress {
            font-size: 16px;
            color: #64748b;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 우측 상단 3x2 물질 버튼 패널 -->
    <div class="top-controls">
        <button class="mat-btn" data-target="chkRbc">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="rbc" width="24" height="24"></canvas>
                <span>적혈구</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkProtein">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="protein" width="24" height="24"></canvas>
                <span>단백질</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkGlucose">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="glucose" width="24" height="24"></canvas>
                <span>포도당/아미노산</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkWater">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="water" width="24" height="24"></canvas>
                <span>물/무기염류</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="mat-btn" data-target="chkUrea">
            <div class="btn-left">
                <canvas class="btn-icon" data-type="urea" width="24" height="24"></canvas>
                <span>요소/노폐물</span>
            </div>
            <span class="status-dot"></span>
        </button>
        <button class="btn all-view" id="btnAllView">모든 물질 보기 (ON/OFF)</button>
    </div>

    <!-- 2. 좌측 하단 제어 버튼 패널 (명칭 버튼 삭제 반영) -->
    <div class="bottom-left-controls">
        <button class="btn primary" id="btnPlayPause">일시정지</button>
        <button class="btn" id="btnReset">처음으로</button>
    </div>

    <!-- 3. 우측 하단 퀴즈 모드 제어 버튼 패널 -->
    <div class="bottom-right-controls">
        <button class="btn quiz-btn" id="btnQuizModalOpen">🧠 콩팥 퀴즈 풀기</button>
    </div>

    <!-- 🧠 플로팅 퀴즈 팝업 창 -->
    <div class="quiz-modal" id="quizModal">
        <div class="quiz-header">
            <h3 id="quizTitle">🧠 콩팥 핵심 개념 퀴즈</h3>
            <button class="quiz-close-btn" id="quizCloseBtn">✕</button>
        </div>
        <div class="quiz-body">
            <div class="quiz-question" id="quizQuestionText">문제 내용이 여기에 들어갑니다.</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-input-row">
                <button class="quiz-submit-btn" id="quizSubmitBtn">답 확인</button>
            </div>
            <div class="quiz-feedback" id="quizFeedback"></div>
        </div>
        <div class="quiz-footer">
            <button class="quiz-nav-btn" id="quizPrevBtn">◀ 이전</button>
            <span class="quiz-progress" id="quizProgressText">1 / 4</span>
            <button class="quiz-nav-btn" id="quizNextBtn">다음 ▶</button>
        </div>
    </div>

    <!-- 애니메이션 반응형 메인 뷰 -->
    <div class="view-area">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="bgCanvas"></canvas>
            <canvas id="particleCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
        </div>
        
        <!-- 하단 전체 가득 채우는 개념 설명 패널 -->
        <div class="info-panel" id="infoPanel">
            <strong id="infoTitle">📍 [ 콩팥의 구조와 물질 이동 시뮬레이션 ]</strong>
            <span id="infoDesc">화면의 물음표(?) 상자를 터치하면 해당 부위의 명칭과 설명이 뜬 상태로 유지됩니다.</span>
        </div>
    </div>
</div>

<script>
const BASE_WIDTH = 830;
const BASE_HEIGHT = 360;

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');
const canvasContainer = document.getElementById('canvasContainer');

const infoTitle = document.getElementById('infoTitle');
const infoDesc = document.getElementById('infoDesc');

let scaleRatio = 1;
let offsetX = 0;
let offsetY = 0;

// 공통 도형 그리기 함수
function drawShape(cCtx, type, cx, cy, radius, color) {
    cCtx.beginPath();
    
    if (type === 'rbc') {
        const gradient = cCtx.createRadialGradient(cx, cy, 1, cx, cy, radius);
        gradient.addColorStop(0, '#ff9999');   
        gradient.addColorStop(0.55, '#ef4444'); 
        gradient.addColorStop(1, '#991b1b');   

        cCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        cCtx.fillStyle = gradient;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(150, 0, 0, 0.4)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type === 'protein') {
        const size = radius * 1.8;
        cCtx.fillStyle = color;
        cCtx.fillRect(cx - size / 2, cy - size / 2, size, size);
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.strokeRect(cx - size / 2, cy - size / 2, size, size);

    } else if (type === 'glucose') {
        const r = radius * 1.3;
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const hx = cx + r * Math.cos(angle);
            const hy = cy + r * Math.sin(angle);
            if (i === 0) cCtx.moveTo(hx, hy);
            else cCtx.lineTo(hx, hy);
        }
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type.includes('water')) {
        const r = radius * 1.2;
        cCtx.moveTo(cx, cy - r * 1.4);
        cCtx.bezierCurveTo(cx + r * 1.2, cy - r * 0.2, cx + r * 1.2, cy + r * 1.1, cx, cy + r * 1.1);
        cCtx.bezierCurveTo(cx - r * 1.2, cy + r * 1.1, cx - r * 1.2, cy - r * 0.2, cx, cy - r * 1.4);
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.15)';
        cCtx.lineWidth = 1;
        cCtx.stroke();

    } else if (type.includes('urea')) {
        const r = radius * 1.4;
        cCtx.moveTo(cx, cy - r);
        cCtx.lineTo(cx + r, cy + r * 0.8);
        cCtx.lineTo(cx - r, cy + r * 0.8);
        cCtx.closePath();
        cCtx.fillStyle = color;
        cCtx.fill();
        cCtx.strokeStyle = 'rgba(0,0,0,0.2)';
        cCtx.lineWidth = 1;
        cCtx.stroke();
    }
}

// 버튼 내부 미니 Canvas 아이콘 렌더링
function initButtonIcons() {
    document.querySelectorAll('.btn-icon').forEach(iconCanvas => {
        const iconCtx = iconCanvas.getContext('2d');
        const type = iconCanvas.getAttribute('data-type');
        const cx = 12;
        const cy = 12;
        
        let color = '#000';
        let radius = 7.5;

        if (type === 'rbc') { radius = 11; }
        else if (type === 'protein') { color = '#78350f'; radius = 8.9; }
        else if (type === 'glucose') { color = '#9333ea'; radius = 4.8; }
        else if (type === 'water') { color = '#3b82f6'; radius = 3.2; }
        else if (type === 'urea') { color = '#eab308'; radius = 3.4; }

        drawShape(iconCtx, type, cx, cy, radius, color);
    });
}

// 화면 크기 리사이징 계산 함수
function resizeCanvases() {
    const windowWidth = canvasContainer.clientWidth;
    const windowHeight = canvasContainer.clientHeight;

    [bgCanvas, canvas, overlayCanvas].forEach(c => {
        c.width = windowWidth;
        c.height = windowHeight;
    });

    const scaleX = windowWidth / BASE_WIDTH;
    const scaleY = windowHeight / BASE_HEIGHT;
    scaleRatio = Math.min(scaleX, scaleY);

    offsetX = (windowWidth - BASE_WIDTH * scaleRatio) / 2;
    offsetY = (windowHeight - BASE_HEIGHT * scaleRatio) / 2;

    drawBackground();
}

// 배경 그리기
const bgImage = new Image();
bgImage.src = 'background_2.png';
bgImage.onload = () => {
    resizeCanvases();
};

function drawBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    if (bgImage.complete && bgImage.naturalWidth !== 0) {
        bgCtx.save();
        bgCtx.translate(offsetX, offsetY);
        bgCtx.scale(scaleRatio, scaleRatio);
        bgCtx.drawImage(bgImage, 0, 0, BASE_WIDTH, BASE_HEIGHT);
        bgCtx.restore();
    }
}

window.addEventListener('resize', resizeCanvases);

let isRunning = true;
let particles = [];
let spawnCounters = {};

const states = {
    chkRbc: false,
    chkProtein: false,
    chkGlucose: false,
    chkWater: false,
    chkUrea: false
};

const revealedLabels = {
    "콩팥동맥": false,
    "토리": false,
    "보먼주머니": false,
    "세뇨관": false,
    "모세혈관": false,
    "콩팥정맥": false,
    "콩팥깔대기": false,
    "↓ 여과": false,
    "재흡수 ↑": false,
    "↓ 분비": false
};

// 최신 변경 텍스트 적용된 개념 데이터
const regions = [
    { name: "콩팥동맥", x: 105, y: 35, w: 90, h: 40, desc: "심장에서 나와 콩팥으로 들어오는 혈액이 흐르는 혈관", type: "region" },
    { name: "토리", x: 175, y: 75, w: 60, h: 50, desc: "모세혈관이 실타래처럼 뭉쳐 있는 구조.", type: "region" },
    { name: "보먼주머니", x: 80, y: 140, w: 85, h: 45, desc: "토리를 둘러싼 주머니 모양의 구조, 세뇨관과 연결되어 있음", type: "region" },
    { name: "세뇨관", x: 260, y: 240, w: 90, h: 40, desc: "보먼주머니와 연결된 가늘고 긴 관", type: "region" },
    { name: "모세혈관", x: 450, y: 155, w: 80, h: 40, desc: "세뇨관에서 재흡수되는 물질을 다시 받아들이고 노폐물을 분비하는 혈관", type: "region" },
    { name: "콩팥정맥", x: 675, y: 100, w: 80, h: 40, desc: "여과와 재흡수가 끝난 깨끗한 혈액이 콩팥에서 나와 심장으로 들어가는 혈관", type: "region" },
    { name: "콩팥깔대기", x: 750, y: 220, w: 90, h: 40, desc: "재흡수되고 남은 물과 요소 등의 노폐물이 모여 오줌으로 배출되는 통로", type: "region" },
    // 과정 항목 (초록색 유지)

    { name: "↓ 분비", x: 520, y: 200, w: 70, h: 35, desc: "여과되지 않고 혈액에 남아 있던 노폐물이 세뇨관으로 분비되는 과정", type: "process" }

canvasContainer.addEventListener('click', (e) => {
    const rect = canvasContainer.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left - offsetX) / scaleRatio;
    const mouseY = (e.clientY - rect.top - offsetY) / scaleRatio;

            revealedLabels[reg.name] = true;
            selectedRegion = reg; // 눌린 개념을 고정

class Particle {
    constructor(type, path, color, radius, speed) {
        this.type = type;
        this.path = path;
        this.color = color;
        this.radius = radius;
        this.speed = speed;
        this.pathIndex = 0;
        this.progress = 0;
        this.x = path[0].x;
        this.y = path[0].y;
    }

    update() {
        if (this.pathIndex >= this.path.length - 1) return false; 
        const start = this.path[this.pathIndex];
        const end = this.path[this.pathIndex + 1];
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        this.speed = 1.8; 
        this.progress += this.speed / distance;

        if (this.progress >= 1) {
            this.progress = 0;
            this.pathIndex++;
        }

        if (this.pathIndex < this.path.length - 1) {
            const currStart = this.path[this.pathIndex];
            const currEnd = this.path[this.pathIndex + 1];
            this.x = currStart.x + (currEnd.x - currStart.x) * this.progress;
            this.y = currStart.y + (currEnd.y - currStart.y) * this.progress;
        }
        return true;
    }

    draw() {
        drawShape(ctx, this.type, this.x, this.y, this.radius, this.color);
    }
}

const particleConfigs = [
    { id: 'chkRbc', type: 'rbc', path: pathArteryToVein, color: '#ef4444', radius: 8, speed: 1.8, interval: 70 },
    { id: 'chkProtein', type: 'protein', path: pathArteryToVein, color: '#78350f', radius: 6.5, speed: 1.8, interval: 90 },
    { id: 'chkGlucose', type: 'glucose', path: pathGlucose, color: '#9333ea', radius: 3.5, speed: 1.8, interval: 60 },
    { id: 'chkUrea', type: 'urea_excrete', path: pathExcretion, color: '#eab308', radius: 2.5, speed: 1.8, interval: 50 }, 
    { id: 'chkUrea', type: 'urea_secrete', path: pathUreaSecretion, color: '#ca8a04', radius: 2.5, speed: 1.8, interval: 160 }, 
    { id: 'chkWater', type: 'water_reabsorb', path: pathGlucose, color: '#3b82f6', radius: 2.3, speed: 1.8, interval: 25 },
    { id: 'chkWater', type: 'water_excrete', path: pathExcretion, color: '#3b82f6', radius: 2.3, speed: 1.8, interval: 100 }
];

function initParticles() {
    particles = [];
    spawnCounters = {};
    particleConfigs.forEach(cfg => { spawnCounters[cfg.type] = 0; });
}

// 오버레이 그리기 (과정 항목 초록색 물음표 상자 복구 반영)
function drawOverlay() {
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

    overlayCtx.save();
    overlayCtx.translate(offsetX, offsetY);
    overlayCtx.scale(scaleRatio, scaleRatio);
    overlayCtx.textAlign = 'center';

    regions.forEach(l => {
        const isRevealed = revealedLabels[l.name];
        const isSelected = selectedRegion && selectedRegion.name === l.name;
        const isProcess = l.type === 'process';

        const displayText = isRevealed ? l.name : '?';

        overlayCtx.font = isRevealed ? '18px "Jua", sans-serif' : 'bold 20px "Jua", sans-serif';
        const textWidth = overlayCtx.measureText(displayText).width;
        const w = Math.max(textWidth + 18, 42);

        if (isRevealed) {
            if (isProcess) {
                overlayCtx.fillStyle = isSelected ? 'rgba(220, 252, 231, 0.98)' : 'rgba(240, 253, 244, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#16a34a' : '#bbf7d0';
            } else {
                overlayCtx.fillStyle = isSelected ? 'rgba(239, 246, 255, 0.98)' : 'rgba(255, 255, 255, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#3b82f6' : '#cbd5e1';
            }
            overlayCtx.lineWidth = isSelected ? 2 : 1;
        } else {
            // 미열람 (물음표 상자 상태) - 구조는 노란색, 과정은 초록색
            if (isProcess) {
                overlayCtx.fillStyle = isSelected ? 'rgba(187, 247, 208, 0.98)' : 'rgba(220, 252, 231, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#16a34a' : '#86efac';
            } else {
                overlayCtx.fillStyle = isSelected ? 'rgba(254, 240, 138, 0.98)' : 'rgba(254, 249, 195, 0.9)';
                overlayCtx.strokeStyle = isSelected ? '#eab308' : '#fde047';
            }
            overlayCtx.lineWidth = 2;
        }

        overlayCtx.fillRect(l.x - w/2, l.y - 16, w, 26);
        overlayCtx.strokeRect(l.x - w/2, l.y - 16, w, 26);

        if (isRevealed) {
            overlayCtx.fillStyle = isProcess ? (isSelected ? '#15803d' : '#166534') : (isSelected ? '#1d4ed8' : '#1e293b');
        } else {
            overlayCtx.fillStyle = isProcess ? '#166534' : '#854d0e';
        }
        overlayCtx.fillText(displayText, l.x, l.y + 4);
    });

    overlayCtx.restore();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scaleRatio, scaleRatio);

    if (isRunning) {
        particleConfigs.forEach(cfg => {
            if (states[cfg.id]) {
                spawnCounters[cfg.type]++;
                if (spawnCounters[cfg.type] >= cfg.interval) {
                    particles.push(new Particle(cfg.type, cfg.path, cfg.color, cfg.radius, cfg.speed));
                    spawnCounters[cfg.type] = 0;
                }
            }
        });

        particles = particles.filter(p => {
            const isAlive = p.update();
            if (isAlive && states[getConfigId(p.type)]) {
                p.draw();
            }
            return isAlive;
        });
    } else {
        particles.forEach(p => {
            if (states[getConfigId(p.type)]) {
                p.draw();
            }
        });
    }

    ctx.restore();
    drawOverlay();
    requestAnimationFrame(animate);
}

function getConfigId(type) {
    if (type === 'rbc') return 'chkRbc';
    if (type === 'protein') return 'chkProtein';
    if (type === 'glucose') return 'chkGlucose';
    if (type.includes('urea')) return 'chkUrea';
    if (type.includes('water')) return 'chkWater';
}

let currentQuizIndex = 0;
const quizModal = document.getElementById('quizModal');
const quizQuestionText = document.getElementById('quizQuestionText');
const quizOptions = document.getElementById('quizOptions');
const quizSubmitBtn = document.getElementById('quizSubmitBtn');
const quizFeedback = document.getElementById('quizFeedback');
const quizProgressText = document.getElementById('quizProgressText');

function loadQuiz(index) {
    currentQuizIndex = index;
    quizQuestionText.textContent = quizData[index].q;
    quizOptions.innerHTML = "";
    quizData[index].options.forEach(text => {
        const label = document.createElement('label');
        label.className = 'quiz-option';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = text;
        cb.addEventListener('change', () => {
            label.classList.toggle('checked', cb.checked);
            quizFeedback.innerHTML = "";
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(text));
        quizOptions.appendChild(label);
    });
    quizFeedback.innerHTML = "";
    quizProgressText.textContent = `${index + 1} / ${quizData.length}`;
}

document.getElementById('btnQuizModalOpen').addEventListener('click', () => {
    quizModal.classList.add('active');
    loadQuiz(currentQuizIndex);
});

document.getElementById('quizCloseBtn').addEventListener('click', () => {
    quizModal.classList.remove('active');
});

document.getElementById('quizPrevBtn').addEventListener('click', () => {
    if (currentQuizIndex > 0) {
        loadQuiz(currentQuizIndex - 1);
    }
});

document.getElementById('quizNextBtn').addEventListener('click', () => {
    if (currentQuizIndex < quizData.length - 1) {
        loadQuiz(currentQuizIndex + 1);
    }
});

// 답 확인 및 채점 로직 (선택한 보기 = 정답 보기 일 때만 정답)
quizSubmitBtn.addEventListener('click', () => {
    const selected = Array.from(quizOptions.querySelectorAll('input:checked')).map(cb => cb.value);
    if (selected.length === 0) {
        quizFeedback.innerHTML = "<span style='color:#d97706;'>⚠️ 정답을 골라주세요!</span>";
        return;
    }

    const answers = quizData[currentQuizIndex].answers;
    const isCorrect = selected.length === answers.length && answers.every(a => selected.includes(a));

    if (isCorrect) {
        quizFeedback.innerHTML = "<span style='color:#16a34a; display:flex; align-items:center; gap:6px;'><span style='font-size:24px;'>⭕</span> 정답입니다! 아주 잘했어요!</span>";
    } else {
        quizFeedback.innerHTML = "<span style='color:#dc2626; display:flex; align-items:center; gap:6px;'><span style='font-size:24px;'>❌</span> 다시 풀어보세요!</span>";
    }
});

// 물질 토글 버튼 이벤트
document.querySelectorAll('.mat-btn[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        states[target] = !states[target];
        btn.classList.toggle('active', states[target]);

        if (!states[target]) {
            particles = particles.filter(p => getConfigId(p.type) !== target);
        }
    });
});

// 모든 물질 보기 버튼
let allViewMode = false;
const btnAllView = document.getElementById('btnAllView');
btnAllView.addEventListener('click', () => {
    allViewMode = !allViewMode;
    ['chkRbc', 'chkProtein', 'chkGlucose', 'chkWater', 'chkUrea'].forEach(id => {
        states[id] = allViewMode;
        const btn = document.querySelector(`[data-target="${id}"]`);
        if (btn) btn.classList.toggle('active', allViewMode);
    });
    btnAllView.textContent = allViewMode ? '모든 물질 끄기' : '모든 물질 보기 (ON/OFF)';
    if (!allViewMode) particles = [];
});

// 재생/일시정지 제어
const btnPlayPause = document.getElementById('btnPlayPause');
btnPlayPause.addEventListener('click', () => {
    isRunning = !isRunning;

});

document.getElementById('btnReset').addEventListener('click', () => {

    infoTitle.textContent = "📍 [ 콩팥의 구조와 물질 이동 시뮬레이션 ]";

    drawOverlay();
});

initButtonIcons();
